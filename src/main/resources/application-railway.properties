# O HTTPS público termina no proxy da plataforma. O serviço expõe somente sua porta HTTP interna.
server.address=0.0.0.0
server.port=${PORT:8080}
server.ssl.enabled=false
# Redirecionamentos relativos preservam o HTTPS externo sem consumir cabeçalhos encaminhados.
server.forward-headers-strategy=none
server.tomcat.use-relative-redirects=true
