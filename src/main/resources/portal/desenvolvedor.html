<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desenvolvedor | Orquestrador FinOps</title>
  <link rel="stylesheet" href="/portal-assets/portal.css">
  <script type="module" src="/portal-assets/portal.js"></script>
</head>
<body data-perfil="DESENVOLVEDOR">
  <a class="skip" href="#conteudo">Pular para o conteúdo</a>
  <div class="dashboard">
    <aside class="sidebar">
      <a class="brand" href="/portal"><span class="brand-mark" aria-hidden="true">F</span> Orquestrador FinOps</a>
      <nav aria-label="Painel do Desenvolvedor">
        <a href="#catalogo">Catálogo</a>
        <a href="#pedidos">Minhas requisições</a>
      </nav>
    </aside>
    <main class="dashboard-main" id="conteudo">
      <header class="dashboard-header">
        <div><h1>Desenvolvedor</h1><p class="muted">Consulte recursos e acompanhe suas requisições.</p></div>
        <form action="/logout" method="post" id="logout"><button class="button secondary" type="submit" disabled>Sair</button></form>
      </header>
      <p id="aviso" class="notice" role="status" hidden></p>
      <section class="surface" id="catalogo" aria-labelledby="titulo-catalogo">
        <h2 id="titulo-catalogo">Catálogo de infraestrutura</h2>
        <p class="muted" id="situacao-catalogo" role="status">Carregando catálogo…</p>
        <div class="table-wrap" hidden>
          <table aria-labelledby="titulo-catalogo">
            <thead><tr><th scope="col">Recurso</th><th scope="col">Custo mensal</th></tr></thead>
            <tbody id="recursos"></tbody>
          </table>
        </div>
      </section>
      <section class="surface" id="pedidos" aria-labelledby="titulo-pedidos">
        <h2 id="titulo-pedidos">Minhas requisições</h2>
        <p class="muted" id="situacao-pedidos" role="status">Carregando requisições…</p>
        <div class="table-wrap" hidden>
          <table aria-labelledby="titulo-pedidos">
            <thead><tr><th scope="col">Requisição</th><th scope="col">Estado</th><th scope="col">Motivo</th><th scope="col">Custo projetado</th></tr></thead>
            <tbody id="requisicoes"></tbody>
          </table>
        </div>
        <button id="mais-pedidos" class="button secondary" type="button" hidden>Mais requisições</button>
      </section>
    </main>
  </div>
</body>
</html>
